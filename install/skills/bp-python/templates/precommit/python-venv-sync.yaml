# The CI gate, moved to commit time.
# TEMPLATE: python.yaml plus a first hook that makes ./venv match a clean CI install.
# Adapt SRC dir, PACKAGE name, OWN_PACKAGE and coverage floor. Keep these comments.
#
# Every hook is `language: system`, not a pinned mirror: a mirror runs its own
# copy of the tool against a config pre-commit chose, so hooks pass while CI
# fails. Tools read `pyproject.toml`, so commit and CI use the same settings.
#
# `pass_filenames: false` on whole-project tools: basedpyright and vulture need
# every file, or everything staged files reference looks unreferenced.
#
# `files` rather than `types: [python]`: pyproject.toml drives the hooks, so a
# commit that changes only that file must still run them.
#
# Install with: pre-commit install
# Run over everything once: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      # Resolve the venv the way the runner does, before anything reads it.
      #
      # CI installs the project into a clean machine, so every dependency comes
      # from PyPI. A developer venv drifts the moment a sibling is installed
      # editable, and an editable install *satisfies* the requirement, so
      # `pip install` alone never undoes it. The venv then reports the right
      # version while loading unreleased source, and a local check passes
      # against code the runner cannot see. Editable installs are removed first,
      # which is the part `pip install` cannot do for itself.
      #
      # Installs runtime deps (via the package) plus the `test` dependency group
      # from pyproject.toml (pip >= 25.1). Lint tools stay on the system.
      # ~2s when nothing has moved. Cross-repo work belongs in the system
      # environment; this venv exists to be what the runner is.
      - id: venv-matches-ci
        name: venv matches CI
        entry: >-
          bash -c '
          [ -d venv ] || python -m venv venv;
          eds=$(venv/bin/pip list --editable --format=freeze 2>/dev/null
          | sed "s/[=@ ].*//" | grep -vix OWN_PACKAGE || true);
          [ -n "$eds" ] && venv/bin/pip uninstall -y -q $eds;
          venv/bin/pip install -q --upgrade . --group test'
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: ruff
        name: ruff (src, test, examples)
        entry: ruff check src test examples
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      # Check-only: a hook that rewrites files mid-commit leaves the staged and
      # working trees different. Fix with `ruff format .` in a commit of its own.
      - id: ruff-format
        name: ruff format --check (src, test, examples)
        entry: ruff format --check src test examples
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: vulture
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: unittest
        name: unittest
        # PYTHONPATH=src, venv/bin/python: see python.yaml.
        entry: env PYTHONPATH=src venv/bin/python -m unittest discover -s test
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: coverage
        name: coverage (unittest, --fail-under)
        # Same run as `unittest`, measured, kept separate so a coverage drop
        # reads as a coverage failure. The floor ratchets: never lower it to
        # make a commit pass.
        entry: >-
          bash -c 'PYTHONPATH=src venv/bin/python -m coverage run --source=PACKAGE
          -m unittest discover -s test -q && venv/bin/python -m coverage report
          --fail-under=85'
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false
