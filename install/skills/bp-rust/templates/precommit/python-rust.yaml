# The CI gate, moved to commit time.
# TEMPLATE: mixed Python + Rust repo. Adapt PYDIR (Python package dir), PACKAGE and
# the coverage floor. Keep these comments.
#
# Every hook is `language: system`, not a pinned mirror: a mirror runs its own
# copy of the tool against a config pre-commit chose, so hooks pass while CI
# fails. Tools read `pyproject.toml` / `Cargo.toml`, so commit and CI agree.
#
# `pass_filenames: false` on whole-project tools: basedpyright, vulture and cargo
# need to see everything, or results are wrong (false "dead code", partial builds).
#
# `files` rather than `types`: the hooks are driven by pyproject.toml / Cargo.toml,
# so a commit that changes only a manifest must still run them. A dependency or
# lint change in the manifest can break the build or surface new clippy warnings
# without any .rs file being touched.
#
# The Rust hooks mirror the CI lint-rust job. cargo sees the whole crate either
# way, so the trigger is "something cargo builds from changed" and the check is
# always crate-wide. clippy runs `--release` to match CI: debug and release do
# not enable the same lints, and a warning in only one of them reaches main.
#
# Layout differs per repo: here `src/` is the Rust crate and the Python package
# sits at PYDIR. Check the layout, do not copy it.
#
# Install with: pre-commit install
# Run over everything once: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (PYDIR, test, examples)
        entry: ruff check PYDIR test examples
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: vulture
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: unittest
        name: unittest
        # venv/bin/python, not the PATH interpreter (lacks project dependencies).
        # PYTHONPATH=. because the package sits at the repo root, not under src/.
        entry: env PYTHONPATH=. venv/bin/python -m unittest discover -s test
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: coverage
        name: coverage (unittest, --fail-under)
        # Same run as `unittest`, measured, kept separate so a coverage drop
        # reads as a coverage failure. The floor ratchets: never lower it to
        # make a commit pass.
        entry: >-
          bash -c 'PYTHONPATH=. venv/bin/python -m coverage run --source=PACKAGE
          -m unittest discover -s test -q && venv/bin/python -m coverage report
          --fail-under=90'
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        files: '(\.rs$|^Cargo\.toml$)'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (release, warnings are errors)
        entry: cargo clippy --release -- -D warnings
        language: system
        files: '(\.rs$|^Cargo\.toml$)'
        pass_filenames: false
